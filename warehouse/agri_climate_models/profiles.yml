agri_climate_models:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: agri_climate.duckdb  # DuckDB will create this local file to store its engine state
      extensions:
        - httpfs
        - aws
      settings:
        s3_endpoint: 127.0.0.1:9000
        s3_access_key_id: minio_admin
        s3_secret_access_key: minio_password
        s3_region: us-east-1
        s3_use_ssl: false
        s3_url_style: path